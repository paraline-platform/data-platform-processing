# ============================================================
# SPARK-JOBS/SPARK-MINIO.YAML — Test: Spark → MinIO connectivity
# ============================================================
# Mục đích: verify
#   1. Spark Python job chạy được (PySpark)
#   2. Spark driver pod có thể reach MinIO service qua cluster DNS
#   3. MinIO health endpoint phản hồi từ namespace data-processing
#
# NOTE: Test này dùng Python urllib (không cần S3A JARs).
# Để test distributed read/write qua S3A, cần custom image có
# hadoop-aws + aws-java-sdk-bundle — xem: spark-jobs/README.md
#
# Cách chạy:
#   ./scripts/run-spark-job.sh dev small spark-minio
#   ./scripts/run-spark-job.sh dev small spark-minio logs
#
# Expected output trong logs:
#   SUCCESS: Spark DataFrame — 3 records
#   SUCCESS: MinIO health — HTTP 200
#   SUCCESS: MinIO S3 API — HTTP 403 (accessible, auth required)
# ============================================================

name: spark-minio
namespace: data-processing

# Dùng apache/spark:3.5.3 — image này đã có Python 3.8.10 built-in
# (apache/spark-py:3.5.3 không tồn tại trên Docker Hub)
image: "apache/spark:3.5.3"
imagePullPolicy: IfNotPresent
type: Python
mode: cluster

mainApplicationFile: "local:///tmp/test_minio.py"
sparkVersion: "3.5.3"
restartPolicy:
  type: Never

# spec.volumes (top-level, CRD requirement)
volumes:
  - name: script-volume
    emptyDir: {}

driverExtras:
  initContainers:
    - name: create-test-script
      image: busybox
      command:
        - sh
        - -c
        - |
          cat > /tmp/test_minio.py << 'PYEOF'
          import urllib.request
          import urllib.error
          from pyspark.sql import SparkSession

          spark = SparkSession.builder.appName("MinIO-Connectivity-Test").getOrCreate()
          sc = spark.sparkContext
          sc.setLogLevel("WARN")

          # --- Test 1: Spark DataFrame ---
          print("\n[TEST 1] Spark DataFrame")
          data = [("product_1", 100), ("product_2", 200), ("product_3", 300)]
          df = spark.createDataFrame(data, ["name", "value"])
          count = df.count()
          assert count == 3, f"Expected 3, got {count}"
          print(f"SUCCESS: Spark DataFrame -- {count} records")

          # --- Test 2: MinIO health endpoint ---
          # /minio/health/live tra ve 200 khi MinIO healthy
          print("\n[TEST 2] MinIO Health Check")
          MINIO = "http://minio.data-storage.svc.cluster.local:9000"
          try:
              resp = urllib.request.urlopen(MINIO + "/minio/health/live", timeout=5)
              print(f"SUCCESS: MinIO health -- HTTP {resp.status}")
          except urllib.error.HTTPError as e:
              print(f"SUCCESS: MinIO health -- HTTP {e.code}")
          except Exception as e:
              print(f"FAILED: MinIO unreachable -- {e}")
              raise

          # --- Test 3: MinIO S3 API ---
          # GET / tra ve 403 (auth required) = MinIO dang hoat dong
          print("\n[TEST 3] MinIO S3 API")
          try:
              resp = urllib.request.urlopen(MINIO + "/", timeout=5)
              print(f"SUCCESS: MinIO S3 API -- HTTP {resp.status}")
          except urllib.error.HTTPError as e:
              if e.code in (403, 400):
                  print(f"SUCCESS: MinIO S3 API accessible -- HTTP {e.code} (auth required, expected)")
              else:
                  print(f"UNEXPECTED: MinIO S3 API -- HTTP {e.code}")
          except Exception as e:
              print(f"FAILED: MinIO S3 API unreachable -- {e}")
              raise

          spark.stop()
          print("\n=== All connectivity tests PASSED ===")
          PYEOF
      volumeMounts:
        - name: script-volume
          mountPath: /tmp
  volumeMounts:
    - name: script-volume
      mountPath: /tmp
