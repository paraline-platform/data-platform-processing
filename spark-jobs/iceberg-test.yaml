# ============================================================
# SPARK-JOBS/ICEBERG-TEST.YAML — Test: Iceberg + HMS + MinIO (P2.2)
# ============================================================
# Verify:
#   1. Spark kết nối được Hive Metastore (catalog "lakehouse")
#   2. Tạo Iceberg table, ghi dữ liệu vào MinIO (S3A)
#   3. Query lại dữ liệu + Iceberg time-travel (snapshot history)
#
# Cách chạy:
#   ./scripts/run-spark-job.sh stg small iceberg-test
#   ./scripts/run-spark-job.sh stg small iceberg-test logs
#   ./scripts/run-spark-job.sh stg small iceberg-test delete
#
# P2.2 — thay đổi so với bản cũ:
#   - Image ghcr có SẴN Iceberg + S3A JARs (không initContainer tải 6 JARs
#     từ Maven mỗi lần chạy; không spark.jars config)
#   - S3A creds KHÔNG hardcode trong sparkConf — driver/executor đọc
#     AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY từ Secret "minio-s3a"
#     (env vars nằm trong default credentials chain của S3A)
#
# Yêu cầu trước khi chạy (P5 sẽ thay bằng ExternalSecret từ Vault):
#   kubectl create secret generic minio-s3a -n data-processing \
#     --from-literal=AWS_ACCESS_KEY_ID=admin \
#     --from-literal=AWS_SECRET_ACCESS_KEY=<minio-root-password>
# ============================================================

name: iceberg-hms-test
namespace: data-processing
image: "ghcr.io/paraline-platform/spark:latest-stg"   # TODO(P3.7): pin sha tag
imagePullPolicy: IfNotPresent
type: Python
mode: cluster
mainApplicationFile: "local:///tmp/test.py"
sparkVersion: "3.5.3"
restartPolicy:
  type: Never

sparkConf:
  # Iceberg SQL extensions — bật CREATE TABLE ... USING iceberg, table.history...
  "spark.sql.extensions": "org.apache.iceberg.spark.extensions.IcebergSparkSessionExtensions"
  "spark.sql.catalogImplementation":                    "in-memory"

  # Lakehouse catalog (Iceberg HiveCatalog → HMS thrift:9083)
  "spark.sql.catalog.lakehouse":                        "org.apache.iceberg.spark.SparkCatalog"
  "spark.sql.catalog.lakehouse.catalog-impl":           "org.apache.iceberg.hive.HiveCatalog"
  "spark.sql.catalog.lakehouse.uri":                    "thrift://hive-metastore.data-modeling.svc.cluster.local:9083"
  "spark.sql.catalog.lakehouse.warehouse":              "s3a://warehouse/"
  "spark.sql.defaultCatalog":                           "lakehouse"

  # MinIO S3A — KHÔNG có access/secret key ở đây (đọc từ env qua Secret)
  "spark.hadoop.fs.s3a.endpoint":                       "http://minio.data-storage.svc.cluster.local:9000"
  "spark.hadoop.fs.s3a.path.style.access":              "true"
  "spark.hadoop.fs.s3a.impl":                           "org.apache.hadoop.fs.s3a.S3AFileSystem"
  "spark.hadoop.fs.s3a.connection.ssl.enabled":         "false"

  # Giữ driver pod sau khi fail để đọc logs (debug mode)
  "spark.kubernetes.driver.deleteOnTermination": "false"

# emptyDir chia sẻ initContainer ↔ driver (chỉ để truyền test script)
volumes:
  - name: workdir
    emptyDir: {}

# ============================================================
# DRIVER: initContainer chỉ còn ghi test script (không network)
# ============================================================
driverExtras:
  envFrom:
    - secretRef:
        name: minio-s3a
  initContainers:
    - name: write-script
      image: busybox
      command:
        - sh
        - -c
        - |
          cat > /tmp/test.py << 'PYEOF'
          from pyspark.sql import SparkSession

          spark = SparkSession.builder.appName("iceberg-hms-test").getOrCreate()
          spark.sparkContext.setLogLevel("WARN")

          SEP = "=" * 60
          print("\n" + SEP)
          print("ICEBERG + HIVE METASTORE + MINIO INTEGRATION TEST")
          print(SEP)

          # 1. Tạo namespace trong lakehouse catalog (HMS)
          spark.sql("CREATE NAMESPACE IF NOT EXISTS lakehouse.demo")
          print("\n[1] Namespace 'lakehouse.demo' created in HMS")

          # 2. Tạo Iceberg table (data lưu trên MinIO qua S3A)
          spark.sql("""
              CREATE TABLE IF NOT EXISTS lakehouse.demo.products (
                id       INT,
                name     STRING,
                category STRING,
                price    DOUBLE
              ) USING iceberg
          """)
          print("[2] Iceberg table 'lakehouse.demo.products' created")

          # 3. Insert dữ liệu
          spark.sql("""
              INSERT INTO lakehouse.demo.products VALUES
                (1, 'Laptop Pro 16',   'electronics', 1299.99),
                (2, 'Wireless Mouse',  'electronics',   29.99),
                (3, 'Standing Desk',   'furniture',    599.99)
          """)
          print("[3] Inserted 3 rows into Iceberg table")

          # 4. Query lại
          df = spark.sql("SELECT * FROM lakehouse.demo.products ORDER BY id")
          print(f"\n[4] Query result: {df.count()} rows")
          df.show()

          # 5. Snapshot history (Iceberg time-travel)
          history = spark.sql("SELECT * FROM lakehouse.demo.products.history")
          print("[5] Table snapshot history (Iceberg time-travel):")
          history.select("made_current_at", "snapshot_id", "parent_id").show()

          print(SEP)
          print("TEST PASSED: Iceberg + HMS + MinIO integration OK!")
          print(SEP + "\n")
          spark.stop()
          PYEOF
          echo "Script ready."
      volumeMounts:
        - name: workdir
          mountPath: /tmp
  volumeMounts:
    - name: workdir
      mountPath: /tmp

# ============================================================
# EXECUTOR: JARs đã trong image — chỉ cần creds
# ============================================================
executorExtras:
  envFrom:
    - secretRef:
        name: minio-s3a
