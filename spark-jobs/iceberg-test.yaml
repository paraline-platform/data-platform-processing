# ============================================================
# SPARK-JOBS/ICEBERG-TEST.YAML — Test: Iceberg + HMS + MinIO
# ============================================================
# Verify:
#   1. Spark kết nối được Hive Metastore (catalog "lakehouse")
#   2. Tạo Iceberg table, ghi dữ liệu vào MinIO (S3A)
#   3. Query lại dữ liệu từ Iceberg table
#   4. Iceberg time-travel (snapshot history)
#
# Cách chạy:
#   ./scripts/run-spark-job.sh dev small iceberg-test
#   ./scripts/run-spark-job.sh dev small iceberg-test logs
#   ./scripts/run-spark-job.sh dev small iceberg-test delete
#
# JARs cần thiết (download bởi initContainer):
#   iceberg-spark-runtime-3.5_2.12-1.6.1.jar  — Iceberg + HiveCatalog (~35MB)
#   hadoop-aws-3.3.4.jar                       — S3AFileSystem implementation
#   aws-java-sdk-s3-1.12.587.jar              — S3 operations
#   aws-java-sdk-core-1.12.587.jar            — AWS SDK core
#   aws-java-sdk-sts-1.12.587.jar             — STS auth
#   aws-java-sdk-dynamodb-1.12.587.jar        — S3AFileSystem loads DynamoDB credential provider
#
# Lý do dùng initContainer thay vì --packages:
#   --packages → Ivy resolver chạy trong Spark Operator pod
#   Operator pod không có home directory → /nonexistent/.ivy2/cache fail
#   initContainer chạy trước driver → download JARs trước, không cần Ivy
# ============================================================

name: iceberg-hms-test
namespace: data-processing
image: "apache/spark:3.5.3"
imagePullPolicy: IfNotPresent
type: Python
mode: cluster
mainApplicationFile: "local:///tmp/test.py"
sparkVersion: "3.5.3"
restartPolicy:
  type: Never

sparkConf:
  # Iceberg SQL extensions — bật CREATE TABLE ... USING iceberg, table.history, v$snapshots...
  "spark.sql.extensions": "org.apache.iceberg.spark.extensions.IcebergSparkSessionExtensions"
  "spark.sql.catalogImplementation":                    "in-memory"

  # Lakehouse catalog config (Iceberg HiveCatalog → HMS thrift:9083)
  # Truy cập bằng: spark.sql("SELECT * FROM lakehouse.demo.products")
  "spark.sql.catalog.lakehouse":                        "org.apache.iceberg.spark.SparkCatalog"
  "spark.sql.catalog.lakehouse.catalog-impl":           "org.apache.iceberg.hive.HiveCatalog"
  "spark.sql.catalog.lakehouse.uri":                    "thrift://hive-metastore.data-modeling.svc.cluster.local:9083"
  "spark.sql.catalog.lakehouse.warehouse":              "s3a://warehouse/"
  "spark.sql.defaultCatalog":                           "lakehouse"

  # MinIO S3A config
  "spark.hadoop.fs.s3a.endpoint":                       "http://minio.data-storage.svc.cluster.local:9000"
  "spark.hadoop.fs.s3a.access.key":                     "admin"
  "spark.hadoop.fs.s3a.secret.key":                     "minio-dev-password"
  "spark.hadoop.fs.s3a.path.style.access":              "true"
  "spark.hadoop.fs.s3a.impl":                           "org.apache.hadoop.fs.s3a.S3AFileSystem"
  "spark.hadoop.fs.s3a.connection.ssl.enabled":         "false"

  # JARs được download bởi initContainer vào /tmp/jars/
  # local:// = đọc từ filesystem của driver/executor pod (không qua Ivy)
  "spark.jars": "local:///tmp/jars/iceberg-spark-runtime-3.5_2.12-1.6.1.jar,local:///tmp/jars/hadoop-aws-3.3.4.jar,local:///tmp/jars/aws-java-sdk-s3-1.12.587.jar,local:///tmp/jars/aws-java-sdk-core-1.12.587.jar,local:///tmp/jars/aws-java-sdk-sts-1.12.587.jar,local:///tmp/jars/aws-java-sdk-dynamodb-1.12.587.jar"

  # Giữ driver pod sau khi fail để đọc logs (debug mode)
  "spark.kubernetes.driver.deleteOnTermination": "false"

# emptyDir volume: chia sẻ giữa initContainer và main container trong cùng pod
volumes:
  - name: workdir
    emptyDir: {}

# ============================================================
# DRIVER: download JARs + write test script
# ============================================================
driverExtras:
  initContainers:
    - name: setup
      image: busybox
      command:
        - sh
        - -c
        - |
          set -e
          mkdir -p /tmp/jars
          MAVEN="https://repo1.maven.org/maven2"

          echo "[1/6] Downloading iceberg-spark-runtime (~35MB)..."
          wget -q -O /tmp/jars/iceberg-spark-runtime-3.5_2.12-1.6.1.jar \
            "${MAVEN}/org/apache/iceberg/iceberg-spark-runtime-3.5_2.12/1.6.1/iceberg-spark-runtime-3.5_2.12-1.6.1.jar"

          echo "[2/6] Downloading hadoop-aws..."
          wget -q -O /tmp/jars/hadoop-aws-3.3.4.jar \
            "${MAVEN}/org/apache/hadoop/hadoop-aws/3.3.4/hadoop-aws-3.3.4.jar"

          echo "[3/6] Downloading aws-java-sdk-s3..."
          wget -q -O /tmp/jars/aws-java-sdk-s3-1.12.587.jar \
            "${MAVEN}/com/amazonaws/aws-java-sdk-s3/1.12.587/aws-java-sdk-s3-1.12.587.jar"

          echo "[4/6] Downloading aws-java-sdk-core..."
          wget -q -O /tmp/jars/aws-java-sdk-core-1.12.587.jar \
            "${MAVEN}/com/amazonaws/aws-java-sdk-core/1.12.587/aws-java-sdk-core-1.12.587.jar"

          echo "[5/6] Downloading aws-java-sdk-sts..."
          wget -q -O /tmp/jars/aws-java-sdk-sts-1.12.587.jar \
            "${MAVEN}/com/amazonaws/aws-java-sdk-sts/1.12.587/aws-java-sdk-sts-1.12.587.jar"

          echo "[6/6] Downloading aws-java-sdk-dynamodb..."
          wget -q -O /tmp/jars/aws-java-sdk-dynamodb-1.12.587.jar \
            "${MAVEN}/com/amazonaws/aws-java-sdk-dynamodb/1.12.587/aws-java-sdk-dynamodb-1.12.587.jar"

          echo "JARs ready:"
          ls -lh /tmp/jars/

          echo "Writing test script..."
          cat > /tmp/test.py << 'PYEOF'
          from pyspark.sql import SparkSession

          spark = SparkSession.builder.appName("iceberg-hms-test").getOrCreate()
          spark.sparkContext.setLogLevel("WARN")

          SEP = "=" * 60
          print("\n" + SEP)
          print("ICEBERG + HIVE METASTORE + MINIO INTEGRATION TEST")
          print(SEP)

          # 1. Tạo namespace trong lakehouse catalog (HMS)
          spark.sql("CREATE NAMESPACE IF NOT EXISTS lakehouse.demo")
          print("\n[1] Namespace 'lakehouse.demo' created in HMS")

          # 2. Tạo Iceberg table (data lưu trên MinIO qua S3A)
          spark.sql("""
              CREATE TABLE IF NOT EXISTS lakehouse.demo.products (
                id       INT,
                name     STRING,
                category STRING,
                price    DOUBLE
              ) USING iceberg
          """)
          print("[2] Iceberg table 'lakehouse.demo.products' created")
          print("    Data files stored in: s3a://warehouse/demo/products/")
          print("    Metadata managed by: HMS (PostgreSQL backend)")

          # 3. Insert dữ liệu
          spark.sql("""
              INSERT INTO lakehouse.demo.products VALUES
                (1, 'Laptop Pro 16',   'electronics', 1299.99),
                (2, 'Wireless Mouse',  'electronics',   29.99),
                (3, 'Standing Desk',   'furniture',    599.99)
          """)
          print("[3] Inserted 3 rows into Iceberg table")

          # 4. Query lại
          df = spark.sql("SELECT * FROM lakehouse.demo.products ORDER BY id")
          count = df.count()
          print(f"\n[4] Query result: {count} rows")
          df.show()

          # 5. Xem snapshot history (Iceberg time-travel)
          history = spark.sql("SELECT * FROM lakehouse.demo.products.history")
          print("[5] Table snapshot history (Iceberg time-travel):")
          history.select("made_current_at", "snapshot_id", "parent_id").show()

          print(SEP)
          print("TEST PASSED: Iceberg + HMS + MinIO integration OK!")
          print(SEP + "\n")
          spark.stop()
          PYEOF
          echo "Init done."
      volumeMounts:
        - name: workdir
          mountPath: /tmp
  volumeMounts:
    - name: workdir
      mountPath: /tmp

# ============================================================
# EXECUTOR: chỉ cần JARs (không cần test script)
# ============================================================
executorExtras:
  initContainers:
    - name: download-jars
      image: busybox
      command:
        - sh
        - -c
        - |
          set -e
          mkdir -p /tmp/jars
          MAVEN="https://repo1.maven.org/maven2"
          wget -q -O /tmp/jars/iceberg-spark-runtime-3.5_2.12-1.6.1.jar \
            "${MAVEN}/org/apache/iceberg/iceberg-spark-runtime-3.5_2.12/1.6.1/iceberg-spark-runtime-3.5_2.12-1.6.1.jar"
          wget -q -O /tmp/jars/hadoop-aws-3.3.4.jar \
            "${MAVEN}/org/apache/hadoop/hadoop-aws/3.3.4/hadoop-aws-3.3.4.jar"
          wget -q -O /tmp/jars/aws-java-sdk-s3-1.12.587.jar \
            "${MAVEN}/com/amazonaws/aws-java-sdk-s3/1.12.587/aws-java-sdk-s3-1.12.587.jar"
          wget -q -O /tmp/jars/aws-java-sdk-core-1.12.587.jar \
            "${MAVEN}/com/amazonaws/aws-java-sdk-core/1.12.587/aws-java-sdk-core-1.12.587.jar"
          wget -q -O /tmp/jars/aws-java-sdk-sts-1.12.587.jar \
            "${MAVEN}/com/amazonaws/aws-java-sdk-sts/1.12.587/aws-java-sdk-sts-1.12.587.jar"
          wget -q -O /tmp/jars/aws-java-sdk-dynamodb-1.12.587.jar \
            "${MAVEN}/com/amazonaws/aws-java-sdk-dynamodb/1.12.587/aws-java-sdk-dynamodb-1.12.587.jar"
          echo "Executor JARs ready."
      volumeMounts:
        - name: workdir
          mountPath: /tmp
  volumeMounts:
    - name: workdir
      mountPath: /tmp
