# ============================================================
# CI — data-platform-processing
#
# Trigger: push hoặc PR vào stg / uat / prd
#
# Branch → Image tag:
#   stg  → ghcr.io/paraline-platform/dbt:stg-<sha>
#   uat  → ghcr.io/paraline-platform/dbt:uat-<sha>
#   prd  → ghcr.io/paraline-platform/dbt:prd-<sha>
#
# Jobs:
#   1. dbt-parse      : dbt parse (syntax + ref() validation)
#   2. validate-spark : yamllint spark-jobs/
#   3. build-dbt-image: build + push GHCR (chỉ khi push)
# ============================================================
name: CI

on:
  push:
    branches: [stg, uat, prd]
  pull_request:
    branches: [stg, uat, prd]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/paraline-platform/dbt

jobs:
  # ----------------------------------------------------------
  # JOB 1: dbt parse — validate toàn bộ models/macros/sources
  # ----------------------------------------------------------
  dbt-parse:
    name: dbt Parse
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dbt
        run: pip install "dbt-core>=1.8.0,<2.0.0" "dbt-spark[PyHive]>=1.8.0,<2.0.0"

      - name: Create dummy profiles.yml
        run: |
          mkdir -p ~/.dbt
          cat > ~/.dbt/profiles.yml << 'EOF'
          data_platform:
            target: dev
            outputs:
              dev:
                type: spark
                method: thrift
                host: localhost
                port: 10000
                schema: dbt_dev
                threads: 1
          EOF

      - name: dbt parse
        run: |
          cd dbt && dbt parse --profiles-dir ~/.dbt --project-dir .
          echo "✓ dbt parse passed"

  # ----------------------------------------------------------
  # JOB 2: Validate YAML syntax của spark-jobs (values files)
  # ----------------------------------------------------------
  validate-spark:
    name: Validate SparkJob YAML
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install yamllint
        run: pip install yamllint

      - name: Validate spark-jobs/
        run: |
          yamllint -d "{extends: relaxed, rules: {line-length: {max: 200}}}" spark-jobs/
          echo "✓ YAML syntax passed"

  # ----------------------------------------------------------
  # JOB 3: Build & Push dbt image
  # Tag: <branch>-<short-sha> + latest-<branch>
  # ----------------------------------------------------------
  build-dbt-image:
    name: Build & Push dbt (${{ github.ref_name }})
    runs-on: ubuntu-latest
    needs: [dbt-parse, validate-spark]
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=${{ github.ref_name }}-,format=short
            type=raw,value=latest-${{ github.ref_name }},enable=${{ github.event_name == 'push' }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/dbt/Dockerfile
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        if: github.event_name == 'push'
        run: |
          echo "### Image pushed 🚀" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** \`${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Tags:**" >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.meta.outputs.tags }}" | sed 's/^/- `/' | sed 's/$/`/' >> $GITHUB_STEP_SUMMARY
