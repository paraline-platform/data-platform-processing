version: 2

sources:
  - name: demo
    # spark.sql.defaultCatalog=nessie → schema "demo" = nessie.demo
    schema: demo
    description: "Iceberg tables trong nessie.demo (tạo bởi iceberg-test Spark job)"
    tables:
      - name: products
        description: "Demo products table — id, name, category, price"
        columns:
          - name: id
            description: "Product ID"
            tests: [not_null, unique]
          - name: name
            description: "Product name"
            tests: [not_null]
          - name: category
            description: "Product category"
            tests: [not_null]
          - name: price
            description: "Product price (USD)"
            tests: [not_null]
